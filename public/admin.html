<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PARTS.GE — Administration Catalog Control</title>
  <!-- Native font optimizations -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="stylesheet" href="https://googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap">
  <!-- Accelerated inline engine baseline components styles mapping -->
  <style>
    body { font-family: 'Barlow', sans-serif; background-color: #09090b; color: #f4f4f5; }
    .card-dark { background-color: #18181b; border: 1px solid #27272a; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    .input-field { width: 100%; background-color: #09090b; border: 1px solid #27272a; border-radius: 0.375rem; padding: 0.625rem; font-size: 0.875rem; color: #fff; transition: border-color 0.2s; }
    .input-field:focus { border-color: #ea580c; outline: none; }
    .btn-submit { width: 100%; background-color: #ea580c; color: #fff; height: 2.75rem; font-weight: 700; border-radius: 0.375rem; text-transform: uppercase; letter-spacing: 0.05em; transition: background-color 0.2s; cursor: pointer; }
    .btn-submit:hover { background-color: #f97316; }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
  <script src="https://jsdelivr.net"></script>
</head>
<body class="min-h-screen flex flex-col justify-between">

  <header class="border-b border-zinc-800 bg-zinc-950 px-4 py-3.5">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-orange-500 font-bold text-xl">🛠️</span>
        <a href="/" class="text-xl font-bold tracking-tight text-white uppercase">PARTS<span class="text-orange-500">.GE</span> Control Center</a>
      </div>
      <a href="/products" class="text-xs uppercase bg-zinc-800 text-zinc-300 font-bold px-3 py-1.5 rounded-md border border-zinc-700 hover:bg-zinc-700 transition-all">← Back to storefront</a>
    </div>
  </header>

  <main class="max-w-2xl mx-auto w-full px-4 py-12 flex-grow">
    <div class="mb-8">
      <h1 class="text-3xl font-extrabold uppercase tracking-tight text-white">Inventory Management</h1>
      <p class="text-zinc-400 text-sm mt-1">Publish spare parts inventory items directly to your real-time PostgreSQL database store container.</p>
    </div>

    <div id="alertBox" class="hidden p-4 mb-6 rounded-md text-sm border font-medium"></div>

    <form id="adminForm" class="space-y-5 card-dark p-6 rounded-xl">
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-zinc-400 mb-1.5">Spare Part Name *</label>
        <input required id="name" type="text" class="input-field" placeholder="e.g. Front Light Headlamp TOYOTA Prius">
      </div>

      <div class="grid gap-4 sm:grid-cols-2">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-zinc-400 mb-1.5">Price Market Cost (₾) *</label>
          <input required id="price" type="number" step="0.01" class="input-field" placeholder="120.00">
        </div>
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-zinc-400 mb-1.5">Component Condition *</label>
          <select id="condition" class="input-field">
            <option value="new_aftermarket">New · Aftermarket</option>
            <option value="new_oem">New · Genuine OEM</option>
            <option value="used_oem">Used · OEM</option>
            <option value="refurbished">Refurbished</option>
          </select>
        </div>
      </div>

      <div class="grid gap-4 sm:grid-cols-2">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-zinc-400 mb-1.5">Category *</label>
          <select required id="category" class="input-field">
            <option value="Brakes">Brakes</option>
            <option value="Electrical">Electrical</option>
            <option value="Engine">Engine</option>
            <option value="Filters">Filters</option>
            <option value="Lighting">Lighting</option>
            <option value="Suspension">Suspension</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-zinc-400 mb-1.5">Brand Manufacturer *</label>
          <select required id="brand" class="input-field">
            <option value="Toyota">Toyota</option>
            <option value="BMW">BMW</option>
            <option value="Mercedes-Benz">Mercedes-Benz</option>
            <option value="Hyundai">Hyundai</option>
            <option value="Brembo">Brembo</option>
            <option value="Aisin">Aisin</option>
            <option value="Mann-Filter">Mann-Filter</option>
          </select>
        </div>
      </div>
      <div class="border-t border-zinc-800 pt-5">
        <h3 class="text-xs font-bold uppercase text-orange-500 mb-3.5 tracking-wider">Vehicle Diagnostics Compatibility Mapping</h3>
        <div class="grid gap-3 sm:grid-cols-2">
          <div>
            <label class="block text-[10px] font-bold uppercase text-zinc-500 mb-1">Make</label>
            <input type="text" id="make" class="input-field" placeholder="e.g. Toyota">
          </div>
          <div>
            <label class="block text-[10px] font-bold uppercase text-zinc-500 mb-1">Model</label>
            <input type="text" id="model" class="input-field" placeholder="e.g. Prius">
          </div>
        </div>
        <div class="grid gap-3 sm:grid-cols-2 mt-3">
          <div>
            <label class="block text-[10px] font-bold uppercase text-zinc-500 mb-1">From Year</label>
            <input type="number" id="yearStart" class="input-field" placeholder="e.g. 2010">
          </div>
          <div>
            <label class="block text-[10px] font-bold uppercase text-zinc-500 mb-1">To Year</label>
            <input type="number" id="yearEnd" class="input-field" placeholder="e.g. 2015">
          </div>
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-zinc-400 mb-1.5">Part Image URL Link</label>
        <input id="imageUrl" type="url" class="input-field" placeholder="https://unsplash.com...">
      </div>

      <button type="submit" id="btn" class="btn-submit">
        Publish Asset Record to live store
      </button>
    </form>
  </main>

  <footer class="text-center p-5 text-xs text-zinc-600 border-t border-zinc-900 bg-zinc-950">
    © 2026 PARTS.GE · Secure Backoffice Data Dashboard Panel
  </footer>

  <script>
    // ⚠️ REPLACE WITH YOUR ACTUAL PROJECTS VALUES FROM YOUR SUPABASE SCREEN
    const supabaseUrl = "https://supabase.co"; 
    const supabaseKey = "your-anon-key-here";

    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);
    const form = document.getElementById('adminForm');
    const alertBox = document.getElementById('alertBox');
    const btn = document.getElementById('btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.innerText = "Registering and pushing data assets...";
      btn.disabled = true;
      alertBox.className = "hidden";

      const name = document.getElementById('name').value;
      const price = parseFloat(document.getElementById('price').value);
      const condition = document.getElementById('condition').value;
      const category = document.getElementById('category').value;
      const brand = document.getElementById('brand').value;
      const make = document.getElementById('make').value;
      const model = document.getElementById('model').value;
      const yearStart = parseInt(document.getElementById('yearStart').value) || null;
      const yearEnd = parseInt(document.getElementById('yearEnd').value) || null;
      const imageUrl = document.getElementById('imageUrl').value || null;

      try {
        const { data, error } = await _supabase.from('products').insert([
          {
            name,
            price,
            category,
            condition,
            brand,
            make: make || null,
            model: model || null,
            year_start: yearStart,
            year_end: yearEnd,
            image_url: imageUrl,
            in_stock: true
          }
        ]);

        if (error) throw error;

        alertBox.innerText = "🎉 Success! The inventory row has been published directly into the storefront data grid clusters.";
        alertBox.className = "p-4 mb-6 rounded-md text-sm border font-medium bg-zinc-800 border-green-500 text-green-400";
        form.reset();
      } catch (err) {
        alertBox.innerText = "❌ Database Engine Refusal: " + err.message;
        alertBox.className = "p-4 mb-6 rounded-md text-sm border font-medium bg-zinc-800 border-red-500 text-red-400";
      } finally {
        btn.innerText = "Publish Asset Record to live store";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
